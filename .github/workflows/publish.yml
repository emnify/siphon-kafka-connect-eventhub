name: publish

# NOTE: this workflow targets the repository declared in the pom's distributionManagement. Bintray, its original
# target, was shut down in May 2021. Releases are currently cut by the Jenkins pipeline in .jenkins/Jenkinsfile,
# which deploys to AWS CodeArtifact. Point `codeartifact.url` at a real repository, or delete this workflow.

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
      - name: Set env
        # ::set-env was disabled by GitHub in 2020; the replacement is the GITHUB_ENV file.
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - name: Set version based on tag
        run: mvn -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Publish
        run: mvn -B deploy --file pom.xml --settings settings.xml
