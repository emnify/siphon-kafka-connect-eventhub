name: security

# Kept off the per-commit build on purpose: a CVE published overnight would otherwise fail a build for reasons
# that have nothing to do with the commit under test, and the NVD feed download is slow on a cold cache.
on:
  schedule:
    # Mondays 04:17 UTC - ahead of the working week, off the top of the hour so it does not queue behind
    # everyone else's cron.
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      # Only when the dependency tree or the scan itself changes.
      - 'pom.xml'
      - '.owasp-suppressions.xml'
      - '.github/workflows/security.yml'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      # The NVD feed is ~1GB assembled and rarely changes. Restoring it turns a 30-minute cold run into a
      # couple of minutes; the weekly key means it is rebuilt from scratch once a week.
      - name: Cache the NVD data directory
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Scan dependencies for known CVEs
        env:
          # Optional but strongly recommended: without it the NIST API throttles to a crawl. Add it as a
          # repository secret named NVD_API_KEY (https://nvd.nist.gov/developers/request-an-api-key).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B verify -Psecurity-scan -DskipTests

      - name: Upload the report
        # Always: the report is most useful precisely when the previous step failed the build.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn

      - name: Publish findings to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check
